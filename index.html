<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화 검색</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/card.css" />
  </head>
  <body>
    <header class="header">
      <h1>영화 검색</h1>
      <form action="" name="search">
        <input
          type="search"
          name="searchKey"
          class="header__search"
          placeholder="영화 이름을 입력해주세요."
        />
      </form>
      <button data-name="show-bookmarks">북마크 보기</button>
    </header>

    <main class="content">
      <ul class="content__list card-list">
        <!-- <li class="card">
          <div class="card__img" style="background-image: url();"></div>
          <div class="card__title">title</div>
          <div class="card__rating">5.0</div>
        </li> -->
      </ul>
    </main>

    <div class="back-drop hidden" data-name="movie-detail">
      <div class="dialog">
        <button class="dialog__close" data-name="dialog-close">닫기</button>
        <div class="card card_large">
          <div class="card__img card__img_large" data-name="detail-img"></div>
          <h2 class="card__title" data-name="detail-title"></h2>
          <hr class="hr-14">
          <p class="card__overview" data-name="overview"></p>
          <hr class="hr-14">
          <div class="card__text">
            <span class="label">개봉일 :</span>
            <time data-name="release-date"></time>
          </div>
          <div class="card__text">
            <span class="label">평점 : </span>
            <span data-name="detail-rating"></span>
          </div>
          <div data-selected-movie-id="" style="display: none"></div>
        </div>
        <div class="bookmark" data-name="bookmark">
          <div class="bm-img"></div>
          <span class="bm-msg">북마크</span>
        </div>
        <!-- <button class="dialog__btn hidden" data-name="bookmark">북마크 추가하기</button>
        <button class="dialog__btn hidden" data-name="del-bookmark">북마크 삭제하기</button> -->
        <div class="confirm hidden" data-name="confirm">
          <span class="confirm__msg">북마크를 삭제하시겠습니까?</span>
          <button class="confirm__delete btn" data-name="delete">삭제</button>
          <button class="confirm__cancel btn" data-name="cancel">취소</button>
        </div>
      </div>
    </div>

    <script src="js/script.js" type="module"></script>
  </body>
</html>
